apiVersion: batch/v1
kind: Job
metadata:
  name: brain-tumor-pipeline-job
spec:
  template:
    spec:
      containers:
      - name: pipeline-container
        image: brain-tumor-pipeline
        imagePullPolicy: Never
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
      restartPolicy: Never
  backoffLimit: 1
