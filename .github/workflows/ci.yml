name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Phase 2 ETL Pipeline Test
      run: |
        python pipeline.py

    - name: Run Phase 3 Model Architecture & PyTorch Smoke Test
      run: |
        python -c "
        import torch
        from scripts.model import CustomBrainNet

        # Test synthetic forward pass through multi-task heads
        model = CustomBrainNet(num_classes=10, num_weightings=3)
        dummy_img = torch.randn(2, 3, 224, 224)
        dummy_feats = torch.randn(2, 10)

        tumor_out, weight_out, heatmap_out = model(dummy_img, dummy_feats)
        assert tumor_out.shape == (2, 10), 'Tumor head output shape mismatch'
        assert weight_out.shape == (2, 3), 'Weighting head output shape mismatch'
        print('PyTorch Model Forward Pass Smoke Test PASSED!')
        "
